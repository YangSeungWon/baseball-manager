<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Dugout</title>
<meta name="description" content="선수의 진짜 능력은 아무도 모른다. 스카우트의 추정치로 판단하는 야구단 운영 시뮬레이션.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2314161a'/><rect x='5' y='13' width='13' height='6' fill='%23d7d3c8'/><rect x='18' y='13' width='9' height='6' fill='none' stroke='%23d7d3c8'/></svg>">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-card">
    <h1>DUGOUT</h1>
    <p class="sub">야구단 단장 시뮬레이션</p>
    <p class="thesis">선수의 진짜 능력은 <b>아무도 모른다</b>. 스카우트가 준 구간을 보고 판단한다.</p>
    <div id="teamPick" class="teampick"></div>
    <div class="boot-actions">
      <button id="btnNew" class="primary">새 게임</button>
      <button id="btnResume" class="quiet" hidden>이어하기</button>
    </div>
    <p class="lab" style="margin-top:20px">자동 저장 · 되돌리기 없음</p>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <span id="tbYear" class="tb-year"></span>
    <span id="tbPhase" class="tb-phase"></span>
    <span id="tbCount" class="tb-count"></span>
    <span class="tb-team"><span id="tbTeam"></span><em id="tbMode"></em></span>
    <span class="tb-right" id="tbActions"></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div id="toasts" class="toasts"></div>
</div>

<div id="modal" class="modal" hidden><div class="modal-body" id="modalBody"></div></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
