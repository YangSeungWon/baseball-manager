<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Dugout</title>
<meta name="description" content="선수의 진짜 능력은 아무도 모른다. 스카우트의 추정치로 판단하는 야구단 운영 시뮬레이션.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#0e151c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230e151c'/><rect x='5' y='13' width='12' height='6' rx='1' fill='%234c8ed9'/><rect x='18.5' y='13' width='8' height='6' rx='1' fill='none' stroke='%2365727d'/></svg>">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-head">
    <h1>DUGOUT</h1>
    <p class="goal">구단 선택</p>
  </div>
  <div class="boot-main">
    <div id="teamPick" class="teamlist"></div>
    <aside id="dossier" class="dossier"></aside>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <span id="tbYear" class="tb-year"></span>
    <span id="tbPhase" class="tb-phase"></span>
    <span id="tbCount" class="tb-count"></span>
    <span class="tb-team"><span id="tbTeam"></span><em id="tbMode"></em></span>
    <span class="tb-right" id="tbActions"></span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
  <div id="toasts" class="toasts"></div>
</div>

<div id="modal" class="modal" hidden><div class="modal-body" id="modalBody"></div></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
